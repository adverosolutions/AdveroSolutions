<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IG Highlight Results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Figtree",system-ui,sans-serif;color:#16202e;-webkit-font-smoothing:antialiased}
.igRes-sky{background:
 radial-gradient(1200px 600px at 78% -10%,rgba(255,255,255,.95),rgba(255,255,255,0) 60%),
 radial-gradient(900px 520px at 8% 30%,rgba(206,226,250,.75),rgba(206,226,250,0) 70%),
 linear-gradient(180deg,#c9dcf2 0%,#dce8f5 28%,#ecf1f7 58%,#f3f4f6 82%,#e9edf2 100%);}
.igRes-haze{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;pointer-events:none}
.igRes-panel{position:absolute;box-sizing:border-box;background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(248,251,255,.80));border-radius:28px;border:1px solid rgba(255,255,255,.95);
 box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.55),0 40px 70px -30px rgba(38,72,128,.30),0 16px 30px -18px rgba(38,72,128,.22);
 backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3)}
.igRes-panel::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 background:linear-gradient(135deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,0) 28%,rgba(255,255,255,0) 72%,rgba(200,218,242,.35) 100%);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:1.5px}
.igRes-panel::after{content:"";position:absolute;left:10%;right:10%;bottom:-46px;height:34px;border-radius:50%;
 background:radial-gradient(closest-side,rgba(52,86,140,.22),rgba(52,86,140,0));filter:blur(6px);pointer-events:none}
.igRes-eyebrow{font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#1f5fd6;white-space:nowrap}
.igRes-head{font-weight:600;letter-spacing:-.035em;line-height:1.02;white-space:nowrap}
.igRes-grad{background:linear-gradient(180deg,#2f74f5,#5b9bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.igRes-num{font-weight:600;letter-spacing:-.035em;line-height:1;color:#16202e}
.igRes-line{font-weight:500;color:#4d596b;display:flex;align-items:center;white-space:nowrap}
.igRes-dot{border-radius:50%;background:#2f74f5;box-shadow:0 0 0 3px rgba(47,116,245,.15);flex:none}
.igRes-disc{box-shadow:inset 0 2px 0 #fff,inset 0 0 0 1px rgba(255,255,255,.55),0 70px 110px -50px rgba(38,72,128,.34),0 26px 50px -30px rgba(38,72,128,.24)}
.igRes-disc::before{padding:3px}
.igRes-disc::after{bottom:-70px;height:52px;filter:blur(10px)}
</style>
</helmet>
<div class="igRes-sky" style="width: 1080px; height: 1920px; position: relative; overflow: hidden; background-color:#e9f0f8"><div class="igRes-haze" style="width:700px;height:700px;left:-260px;top:520px;background:#d6e6fb"></div><div class="igRes-haze" style="width:600px;height:600px;left:640px;top:1180px;background:#e6f1fb"></div><div class="igRes-haze" style="width:520px;height:520px;left:220px;top:1320px;background:#dff0ec;opacity:.35"></div><div class="igRes-panel igRes-disc" style="left:210px;top:630px;width:660px;height:660px;border-radius:50%;display:flex;align-items:center;justify-content:center"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="312" height="312" fill="none" stroke="#2f74f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex:none"><path d="M3.5 20.5H20.5"/><path d="M6 16.5V13.5"/><path d="M10 16.5V10.5"/><path d="M14 16.5V7.5"/><path d="M18 16.5V4.5"/></svg></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
