body{margin:0;font-family:"Figtree",system-ui,sans-serif;color:#16202e;-webkit-font-smoothing:antialiased}
.upp-sky{background:
 radial-gradient(1200px 600px at 78% -10%,rgba(255,255,255,.95),rgba(255,255,255,0) 60%),

.upp-haze{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;pointer-events:none}
.upp-panel{position:absolute;box-sizing:border-box;background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(248,251,255,.80));border-radius:28px;border:1px solid rgba(255,255,255,.95);

.upp-panel::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
 background:linear-gradient(135deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,0) 28%,rgba(255,255,255,0) 72%,rgba(200,218,242,.35) 100%);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;padding:1.5px}
.upp-panel::after{content:"";position:absolute;left:10%;right:10%;bottom:-46px;height:34px;border-radius:50%;

.upp-eyebrow{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#1f5fd6;white-space:nowrap}
.upp-h{font-weight:600;letter-spacing:-.035em;line-height:1.02;white-space:nowrap}
.upp-grad{background:linear-gradient(180deg,#2f74f5,#5b9bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.upp-num{font-weight:600;letter-spacing:-.035em;line-height:1;color:#16202e;white-space:nowrap}
.upp-line{font-weight:500;color:#4d596b;display:flex;align-items:center;gap:8px;white-space:nowrap}
.upp-dot{width:7px;height:7px;border-radius:50%;background:#2f74f5;box-shadow:0 0 0 3px rgba(47,116,245,.15);flex:none}
.upp-chip{position:relative;box-sizing:border-box;display:flex;align-items:center;border-radius:99px;
 background:linear-gradient(180deg,rgba(255,255,255,.90),rgba(250,252,255,.72));border:1px solid rgba(255,255,255,.95);
 box-shadow:inset 0 1px 0 #fff,0 18px 34px -18px rgba(38,72,128,.30),0 6px 18px -8px rgba(38,72,128,.22)}
