.dB-panel::after{content:"";position:absolute;left:10%;right:10%;bottom:-46px;height:34px;border-radius:50%;

.dB-dot{width:7px;height:7px;border-radius:50%;background:#2f74f5;box-shadow:0 0 0 3px rgba(47,116,245,.15);flex:none}
